    <text x="62" y="61" font-family="Segoe UI,Arial,sans-serif" font-size="14" letter-spacing="2.1" font-weight="600" fill="#46617A">MATHEMATICAL PHYSICS · QUANTUM INFORMATION</text>
    <text x="44" y="129" font-family="Georgia,Times New Roman,serif" font-size="46" font-weight="700" fill="#112B40">Geometry, matter</text>
    <text x="44" y="184" font-family="Georgia,Times New Roman,serif" font-size="46" font-weight="700" fill="#112B40">and quantum information.</text>
    <text x="45" y="244" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#46617A">States, interactions, reconstruction and quantum control.</text>
    <text x="1216" y="280" text-anchor="end" font-family="Consolas,monospace" font-size="12" letter-spacing="1.1" fill="#688398">20 PAPERS · SOURCE &amp; CODE</text>
