<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="304" viewBox="0 0 1280 304" role="img" aria-labelledby="title desc">
  <title id="title">Geometry, matter and quantum information</title>
  <desc id="desc">A research-archive cover with a quiet coordinate grid and three abstract intersecting curves. The curves are illustrative, not plotted data.</desc>
  <defs>
