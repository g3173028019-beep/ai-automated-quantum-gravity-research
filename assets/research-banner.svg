    <clipPath id="clip"><rect x="0.5" y="0.5" width="1279" height="303" rx="8"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1280" height="304" fill="#F5F9FC"/>
    <rect x="720" width="560" height="304" fill="url(#grid)"/>
    <path d="M743 251C858 251 818 58 946 58S1061 243 1248 90" fill="none" stroke="#127D87" stroke-width="2.3"/>
    <path d="M732 88C868 88 870 235 993 235S1123 65 1287 65" fill="none" stroke="#57728E" stroke-width="1.8"/>
    <path d="M757 196C864 23 1079 285 1290 148" fill="none" stroke="#A8783F" stroke-width="1.8"/>
